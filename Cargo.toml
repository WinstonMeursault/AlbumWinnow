[workspace]
members = ["Core/albumwinnow-core", "Core/albumwinnow-ffi"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
blake3 = "=1.8.2"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
thiserror = "=2.0.21"
uniffi = { version = "=0.29.4" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = { version = "=0.11.1", default-features = false }
lz4_flex = { version = "=0.14.2", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
