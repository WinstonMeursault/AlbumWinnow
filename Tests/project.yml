name: AppAcceptance
options:
  deploymentTarget:
    iOS: '26.0'
settings:
  GENERATE_INFOPLIST_FILE: YES
  SWIFT_VERSION: '6.0'
  MARKETING_VERSION: ${ALBUMWINNOW_VERSION}
  CURRENT_PROJECT_VERSION: 1
packages:
  AlbumWinnowRust:
    path: ${ALBUMWINNOW_ROOT}/Packages/AlbumWinnowRust
  AlbumWinnowApple:
    path: ${ALBUMWINNOW_ROOT}/Packages/AlbumWinnowApple
targets:
  AlbumWinnowAcceptance:
    type: application
    platform: iOS
    sources:
      - path: ${ALBUMWINNOW_ROOT}/Apps/Shared
        excludes: [AlbumWinnowApp.swift]
      - ${ALBUMWINNOW_ROOT}/Tests/Host
      - path: ${ALBUMWINNOW_ROOT}/LICENSE
        buildPhase: resources
      - path: ${ALBUMWINNOW_ROOT}/THIRD-PARTY-NOTICES.txt
        buildPhase: resources
      - path: ${ALBUMWINNOW_ROOT}/Packages/AlbumWinnowApple/Tests/AlbumWinnowAppleTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: AlbumWinnowApple
      - package: AlbumWinnowRust
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.github.winstonmeursault.albumwinnow.acceptance
      TARGETED_DEVICE_FAMILY: '1,2'
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Scan simulator test assets.
  AppModelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ${ALBUMWINNOW_ROOT}/Tests/AppTests
      - path: ${ALBUMWINNOW_ROOT}/Localization/messages.json
        buildPhase: resources
    dependencies:
      - target: AlbumWinnowAcceptance
      - package: AlbumWinnowApple
      - package: AlbumWinnowRust
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.github.winstonmeursault.albumwinnow.acceptance.model
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: ["${ALBUMWINNOW_ROOT}/Tests/UITests"]
    dependencies:
      - target: AlbumWinnowAcceptance
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.github.winstonmeursault.albumwinnow.acceptance.ui
      TEST_TARGET_NAME: AlbumWinnowAcceptance
schemes:
  AppAcceptance:
    build:
      targets:
        AlbumWinnowAcceptance: all
        AppModelTests: [test]
        AppUITests: [test]
    test:
      targets: [AppModelTests, AppUITests]
