name: Test and Build

on:
  push:
    branches: [main, dev, 'feature/**', 'fix/**', 'perf/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate localization sources and generated catalogs
        run: |
          python3 -m unittest discover -s Tests/Localization
          python3 -m unittest discover -s Tests/Release
          python3 Tools/Localization/export.py --check
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run core regression tests
        env:
          NSUnbufferedIO: 'YES'
        run: |
          mkdir -p "$HOME/.Trash"
          swift build --package-path Packages/AlbumWinnowCore -c release --build-tests -Xswiftc -enable-testing
          swift test --package-path Packages/AlbumWinnowCore -c release --skip-build &
          test_pid=$!
          (
            for attempt in 1 2 3 4; do sleep 30; done
            mkdir -p .local
            for stalled_pid in $(pgrep -x swiftpm-testing || true); do
              sample "$stalled_pid" 1 -file ".local/core-stall-$stalled_pid.txt" || true
              cat ".local/core-stall-$stalled_pid.txt" || true
            done
            kill -TERM "$test_pid" 2>/dev/null || true
          ) &
          watchdog_pid=$!
          trap 'kill "$watchdog_pid" 2>/dev/null || true' EXIT
          wait "$test_pid"

  app-builds:
    name: Apple app builds
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build macOS app
        run: xcodebuild -project AlbumWinnow.xcodeproj -scheme AlbumWinnow -configuration Release CODE_SIGNING_ALLOWED=NO build
      - name: Build iOS and iPadOS app for Simulator
        run: xcodebuild -project AlbumWinnow.xcodeproj -scheme AlbumWinnowMobile -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  app-tests:
    name: Simulator regression tests (${{ matrix.family }})
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Prepare test generator
        run: command -v xcodegen || brew install xcodegen
      - name: Select a standard simulator
        env:
          SIMULATOR_FAMILY: ${{ matrix.family }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          candidates = [device for runtime, rows in devices['devices'].items()
                        if '.iOS-26-' in runtime for device in rows
                        if device['name'].startswith(os.environ['SIMULATOR_FAMILY']) and 'Duo' not in device['name']]
          assert candidates, 'An iOS 26 standard simulator is required'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('TEST_SIMULATOR_ID=' + candidates[0]['udid'] + '\n')
          PY
      - name: Authorize generated Photos fixtures and verify album scope
        if: matrix.family == 'iPhone'
        env:
          TEST_RUNNER_ALBUMWINNOW_PHOTOS_FIXTURE: '1'
        run: |
          Tests/run-app-tests.sh "$TEST_SIMULATOR_ID" -only-testing:AppUITests/SimulatorPhotosPermissionTests -resultBundlePath .local/ci-photos-permission.xcresult
          Tests/run-app-tests.sh "$TEST_SIMULATOR_ID" -only-testing:AppModelTests/PhotoScopeTests -resultBundlePath .local/ci-photos-scope.xcresult
      - name: Run app model and UI regressions
        run: Tests/run-app-tests.sh "$TEST_SIMULATOR_ID" -resultBundlePath .local/ci-app-tests.xcresult
      - name: Preserve simulator validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-${{ matrix.family }}
          path: |
            .local/ci-app-tests.xcresult
            .local/ci-photos-permission.xcresult
            .local/ci-photos-scope.xcresult
          include-hidden-files: true
          retention-days: 3

  mac-app-tests:
    name: macOS model and UI regressions
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Prepare test generator
        run: command -v xcodegen || brew install xcodegen
      - name: Run macOS regressions
        run: Tests/run-macos-tests.sh -resultBundlePath .local/ci-mac-tests.xcresult
      - name: Preserve macOS validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-macOS
          path: .local/ci-mac-tests.xcresult
          include-hidden-files: true
          retention-days: 3
